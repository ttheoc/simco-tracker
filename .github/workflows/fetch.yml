name: Fetch SimCo Data
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch data
        run: |
          mkdir -p data
          curl -s "https://api.simcotools.com/v1/realms/0/companies/755861" -o data/company.json
          sleep 1
          curl -s "https://api.simcotools.com/v1/realms/0/companies/755861/history" -o data/history.json
          sleep 1
          curl -s "https://api.simcotools.com/v1/realms/0/buildings?page=1&page_size=100" -o data/buildings_p1.json
          sleep 1
          curl -s "https://api.simcotools.com/v1/realms/0/buildings?page=2&page_size=100" -o data/buildings_p2.json
          sleep 1
          curl -s "https://api.simcotools.com/v1/realms/0/resources?page=1" -o data/resources_p1.json
          sleep 1
          curl -s "https://api.simcotools.com/v1/realms/0/resources?page=2" -o data/resources_p2.json
          sleep 1
          curl -s "https://api.simcotools.com/v1/realms/0/resources?page=3" -o data/resources_p3.json
          sleep 1
          curl -s "https://api.simcotools.com/v1/realms/0/resources?page=4" -o data/resources_p4.json
          sleep 1
          curl -s "https://api.simcotools.com/v1/realms/0/market/prices/16" -o data/price_silizium.json
          sleep 1
          curl -s "https://api.simcotools.com/v1/realms/0/market/prices/17" -o data/price_chemikalien.json
          sleep 1
          curl -s "https://api.simcotools.com/v1/realms/0/market/prices/47" -o data/price_boardcomputer.json
          sleep 1
          curl -s "https://api.simcotools.com/v1/realms/0/market/vwaps/16" -o data/vwap_silizium.json
          sleep 1
          curl -s "https://api.simcotools.com/v1/realms/0/market/vwaps/17" -o data/vwap_chemikalien.json
          sleep 1
          curl -s "https://api.simcotools.com/v1/realms/0/market/vwaps/47" -o data/vwap_boardcomputer.json
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update $(date -u +'%Y-%m-%d')" || echo "Keine Aenderungen"
          git push
